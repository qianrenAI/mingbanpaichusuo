<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&amp;display=swap');
    </style>
  </defs>
  <!-- 印章边框 -->
  <rect x="12" y="12" width="276" height="276" rx="8" ry="8"
        fill="none" stroke="#C41E3A" stroke-width="5"/>
  <rect x="22" y="22" width="256" height="256" rx="4" ry="4"
        fill="none" stroke="#C41E3A" stroke-width="1.5"/>
  <!-- "明办" -->
  <text x="150" y="118" text-anchor="middle"
        font-family="'Noto Serif SC', 'SimSun', 'STSong', serif"
        font-size="52" font-weight="700" fill="#C41E3A"
        letter-spacing="8">明办</text>
  <!-- "拍出所" -->
  <text x="150" y="185" text-anchor="middle"
        font-family="'Noto Serif SC', 'SimSun', 'STSong', serif"
        font-size="46" font-weight="700" fill="#C41E3A"
        letter-spacing="6">拍出所</text>
  <!-- 底部装饰线 -->
  <line x1="80" y1="203" x2="220" y2="203" stroke="#C41E3A" stroke-width="1.5" opacity="0.6"/>
  <!-- 小字 "街拍摄影" -->
  <text x="150" y="235" text-anchor="middle"
        font-family="'Noto Serif SC', 'SimSun', 'STSong', serif"
        font-size="18" fill="#C41E3A" letter-spacing="6"
        opacity="0.8">街拍摄影</text>
  <!-- 底部角落装饰 -->
  <rect x="28" y="23" width="6" height="24" rx="2" fill="#C41E3A" opacity="0.4"/>
  <rect x="266" y="23" width="6" height="24" rx="2" fill="#C41E3A" opacity="0.4"/>
  <rect x="28" y="253" width="6" height="24" rx="2" fill="#C41E3A" opacity="0.4"/>
  <rect x="266" y="253" width="6" height="24" rx="2" fill="#C41E3A" opacity="0.4"/>
</svg>
