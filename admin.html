<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>明办拍出所 · 管理后台</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-login {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: #1a1a2e;
    }
    .admin-login h2 {
      font-family: var(--font-serif);
      color: var(--accent);
      font-size: 22px;
      margin-bottom: 24px;
      letter-spacing: 4px;
    }
    .admin-login input {
      padding: 14px 18px;
      border: 1.5px solid rgba(232,200,122,0.3);
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      color: #fff;
      font-size: 18px;
      text-align: center;
      letter-spacing: 6px;
      width: 200px;
      outline: none;
    }
    .admin-login input:focus {
      border-color: var(--accent);
    }
    .admin-login .btn {
      margin-top: 16px;
    }
    .admin-login .error {
      color: #ff6b6b;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    .admin-panel { display: none; padding-bottom: 100px; }
    .admin-panel.active { display: block; }

    .admin-header {
      background: #1a1a2e;
      padding: 20px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .admin-header h1 {
      font-family: var(--font-serif);
      color: var(--accent);
      font-size: 18px;
      letter-spacing: 2px;
    }
    .admin-header .admin-user {
      color: rgba(255,255,255,0.5);
      font-size: 12px;
    }

    .admin-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 20px 16px;
    }
    .stat-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .stat-number {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
    }
    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .admin-section {
      padding: 0 16px 20px;
    }
    .admin-section h3 {
      font-family: var(--font-serif);
      font-size: 16px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    .admin-tabs {
      display: flex;
      gap: 0;
      background: var(--bg-alt);
      border-radius: var(--radius);
      padding: 4px;
      margin-bottom: 20px;
    }
    .admin-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
      color: var(--text-muted);
    }
    .admin-tab.active {
      background: var(--card);
      color: var(--primary);
      font-weight: 700;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .order-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .order-card .order-id {
      font-size: 11px;
      color: var(--text-muted);
      font-family: monospace;
    }
    .order-card .order-info {
      font-size: 14px;
      margin: 8px 0;
    }
    .order-card .order-info strong { color: var(--primary); }
    .order-card .order-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .order-card .order-actions button {
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 12px;
      border: 1.5px solid rgba(0,0,0,0.1);
      background: var(--card);
    }
    .order-card .order-actions .btn-paid {
      background: #27ae60;
      color: #fff;
      border-color: #27ae60;
    }
    .order-card .status-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 11px;
    }
    .status-pending { background: #fff3cd; color: #856404; }
    .status-paid { background: #d4edda; color: #155724; }
    .status-completed { background: #cce5ff; color: #004085; }

    .admin-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }
    .admin-empty .icon { font-size: 40px; margin-bottom: 12px; }

    .photo-manage-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .photo-manage-item {
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      background: var(--bg-alt);
    }
    .photo-manage-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .photo-manage-item .delete-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 12px;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .photo-manage-item:hover .delete-btn { display: flex; }

    .admin-footer {
      text-align: center;
      padding: 20px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .admin-footer a { color: var(--primary); text-decoration: underline; }

    @media (min-width: 480px) {
      .admin-stats {
        grid-template-columns: repeat(4, 1fr);
        max-width: 600px;
        margin: 0 auto;
      }
      .admin-section { max-width: 600px; margin: 0 auto; }
    }
  </style>
</head>
<body>
  <!-- 登录 -->
  <div id="adminLogin" class="admin-login">
    <h2>明办拍出所</h2>
    <p style="color:rgba(255,255,255,0.4);font-size:13px;margin-bottom:20px;">管理后台</p>
    <input type="password" id="adminPwd" placeholder="输入密码" maxlength="6" inputmode="numeric">
    <button class="btn btn-primary" onclick="adminLogin()" style="margin-top:16px;">进入后台</button>
    <div class="error" id="adminError">密码错误</div>
    <p style="color:rgba(255,255,255,0.2);font-size:11px;margin-top:40px;">默认密码: 888888</p>
  </div>

  <!-- 管理面板 -->
  <div id="adminPanel" class="admin-panel">
    <div class="admin-header">
      <h1>📊 管理后台</h1>
      <span class="admin-user">摄影师</span>
    </div>

    <div class="admin-stats" id="adminStats">
      <div class="stat-card">
        <div class="stat-number" id="statOrders">0</div>
        <div class="stat-label">总订单</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="statPending">0</div>
        <div class="stat-label">待支付</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="statPaid">0</div>
        <div class="stat-label">已支付</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="statRevenue">¥0</div>
        <div class="stat-label">总收入</div>
      </div>
    </div>

    <div class="admin-section">
      <div class="admin-tabs" id="adminTabs">
        <div class="admin-tab active" onclick="switchAdminTab('orders')">📋 订单</div>
        <div class="admin-tab" onclick="switchAdminTab('photos')">🖼️ 作品</div>
        <div class="admin-tab" onclick="switchAdminTab('settings')">⚙️ 设置</div>
      </div>

      <!-- 订单管理 -->
      <div id="tabOrders" class="admin-tab-content">
        <h3>📋 预约订单</h3>
        <div id="orderList"></div>
      </div>

      <!-- 作品管理 -->
      <div id="tabPhotos" class="admin-tab-content" style="display:none;">
        <h3>🖼️ 作品管理</h3>
        <div style="margin-bottom:16px;">
          <button class="btn btn-outline" style="font-size:12px;padding:8px 16px;" onclick="alert('请将照片放在桌面「颐和路001」文件夹并告诉虾兵')">
            📤 上传新作品
          </button>
        </div>
        <div id="photoManageGrid" class="photo-manage-grid"></div>
        <div class="admin-empty" id="photoEmpty">
          <div class="icon">📸</div>
          <p>暂无作品照片</p>
          <p style="font-size:12px;color:var(--text-muted);margin-top:4px;">联系虾兵添加照片</p>
        </div>
      </div>

      <!-- 设置 -->
      <div id="tabSettings" class="admin-tab-content" style="display:none;">
        <h3>⚙️ 设置</h3>
        <div class="service-item" style="margin-bottom:12px;">
          <div class="service-icon">💰</div>
          <div class="service-content">
            <h3>单价</h3>
            <p>当前：¥20/张（含精修）</p>
          </div>
        </div>
        <div class="service-item" style="margin-bottom:12px;">
          <div class="service-icon">💳</div>
          <div class="service-content">
            <h3>定金</h3>
            <p>当前：¥20</p>
          </div>
        </div>
        <div class="service-item" style="margin-bottom:12px;">
          <div class="service-icon">📱</div>
          <div class="service-content">
            <h3>抖音号</h3>
            <p>@明办拍出所</p>
          </div>
        </div>
        <div class="service-item" style="margin-bottom:12px;">
          <div class="service-icon">🌐</div>
          <div class="service-content">
            <h3>网站链接</h3>
            <p style="font-size:11px;">https://qianrenai.github.io/mingbanpaichusuo/</p>
          </div>
        </div>
        <button class="btn btn-outline full-width" onclick="if(confirm('确认清除所有订单数据？')){localStorage.removeItem('yh_orders');renderOrders();}" style="margin-top:16px;">
          🗑️ 清除订单数据
        </button>
      </div>
    </div>

    <div class="admin-footer">
      <a href="/mingbanpaichusuo/">← 返回前台</a>
      <br><br>
      <button class="btn btn-ghost" onclick="adminLogout()" style="font-size:12px;">退出登录</button>
    </div>
  </div>

  <script>
    // ═ ═ ═ 登录 ═ ═ ═
    const ADMIN_PWD = '888888';

    window.adminLogin = function() {
      const pwd = document.getElementById('adminPwd').value;
      if (pwd === ADMIN_PWD) {
        document.getElementById('adminLogin').style.display = 'none';
        document.getElementById('adminPanel').classList.add('active');
        renderOrders();
        renderStats();
        initPhotoManage();
      } else {
        document.getElementById('adminError').style.display = 'block';
      }
    };

    // 回车登录
    document.getElementById('adminPwd').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') adminLogin();
    });

    window.adminLogout = function() {
      document.getElementById('adminPanel').classList.remove('active');
      document.getElementById('adminLogin').style.display = 'flex';
      document.getElementById('adminPwd').value = '';
      document.getElementById('adminError').style.display = 'none';
    };

    // ═ ═ ═ Tab切换 ═ ═ ═
    window.switchAdminTab = function(tab) {
      document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.admin-tab-content').forEach(c => c.style.display = 'none');
      event.target.classList.add('active');
      document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).style.display = 'block';
    };

    // ═ ═ ═ 订单管理 ═ ═ ═
    function getOrders() {
      return JSON.parse(localStorage.getItem('yh_orders') || '[]');
    }

    function renderOrders() {
      const orders = getOrders();
      const list = document.getElementById('orderList');
      if (orders.length === 0) {
        list.innerHTML = '<div class="admin-empty"><div class="icon">📋</div><p>暂无订单</p></div>';
        return;
      }
      list.innerHTML = orders.map((o, i) => `
        <div class="order-card">
          <div class="order-id">#${o.id} · ${new Date(o.createdAt).toLocaleString('zh-CN')}</div>
          <div class="order-info">
            👤 ${o.name} · ${o.contact}<br>
            📸 ${o.count}张 ${o.style} · <strong>¥${o.total}</strong><br>
            📅 ${o.date} ${o.note !== '无' ? '· ' + o.note : ''}
          </div>
          <div>
            <span class="status-badge ${o.status === 'paid' ? 'status-paid' : 'status-pending'}">
              ${o.status === 'paid' ? '✅ 已支付' : '⏳ 待支付'}
            </span>
            <span style="font-size:12px;color:var(--text-muted);margin-left:8px;">
              ${o.payment === 'wechat' ? '💚 微信' : '💙 支付宝'}
            </span>
          </div>
          ${o.status !== 'paid' ? `
          <div class="order-actions">
            <button class="btn-paid" onclick="markPaid(${i})">标记已支付</button>
            <button onclick="deleteOrder(${i})">删除</button>
          </div>` : ''}
        </div>
      `).join('');
    }

    window.markPaid = function(index) {
      const orders = getOrders();
      orders[index].status = 'paid';
      localStorage.setItem('yh_orders', JSON.stringify(orders));
      renderOrders();
      renderStats();
    };

    window.deleteOrder = function(index) {
      if (!confirm('确认删除此订单？')) return;
      const orders = getOrders();
      orders.splice(index, 1);
      localStorage.setItem('yh_orders', JSON.stringify(orders));
      renderOrders();
      renderStats();
    };

    function renderStats() {
      const orders = getOrders();
      const total = orders.length;
      const pending = orders.filter(o => o.status !== 'paid').length;
      const paid = orders.filter(o => o.status === 'paid').length;
      const revenue = orders.filter(o => o.status === 'paid').reduce((sum, o) => sum + (o.total || 0), 0);

      document.getElementById('statOrders').textContent = total;
      document.getElementById('statPending').textContent = pending;
      document.getElementById('statPaid').textContent = paid;
      document.getElementById('statRevenue').textContent = '¥' + revenue;
    }

    // ═ ═ ═ 作品管理 ═ ═ ═
    function initPhotoManage() {
      const grid = document.getElementById('photoManageGrid');
      const empty = document.getElementById('photoEmpty');
      // 读取 PHOTOS 数组（从 main.js 的全局变量）
      if (typeof PHOTOS !== 'undefined' && PHOTOS.length > 0) {
        empty.style.display = 'none';
        grid.innerHTML = PHOTOS.map(p => `
          <div class="photo-manage-item">
            <img src="${p.src}" alt="${p.title}" loading="lazy" onerror="this.parentElement.innerHTML='<div style=\\'width:100%;height:100%;background:hsl(${(p.id*60)%360},30%,60%);display:flex;align-items:center;justify-content:center;font-size:24px;color:rgba(255,255,255,0.7);\\'>📷</div>'">
            <button class="delete-btn">✕</button>
          </div>
        `).join('');
      }
    }

    // 密码修改功能
    // 按顺序按出隐藏的密码设置: 点击"默认密码: 888888"文字
    document.querySelector('.admin-login p:last-child').addEventListener('dblclick', function() {
      const newPwd = prompt('设置新密码（6位数字）:', ADMIN_PWD);
      if (newPwd && /^\d{6}$/.test(newPwd)) {
        // 只能内存中修改，本地存储可持久化
        localStorage.setItem('admin_pwd', newPwd);
        alert('密码已修改！下次登录请使用新密码。');
      }
    });

    // 从 localStorage 读取密码
    const savedPwd = localStorage.getItem('admin_pwd');
    if (savedPwd) {
      // 替换默认密码
      window.ADMIN_PWD = savedPwd;
    }
  </script>
</body>
</html>
